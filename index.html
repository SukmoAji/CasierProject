<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f3d33">
<link rel="manifest" href="manifest.webmanifest">
<title>Kasir Eyang</title>
<style>
:root{--bg:#f2f3ee;--ink:#1c1a17;--g:#1f3d33;--mut:#6b6f68;--line:#d9dbd2;--hot:#b4430f}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:72px}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--g);color:#fff;position:sticky;top:0;z-index:2}
header{flex-wrap:wrap}header b{flex:1;font-size:18px}header button{padding:8px 10px;font-size:14px}header small{opacity:.8}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;background:var(--g);color:#fff}
button.o{background:transparent;color:inherit;border:1px solid currentColor}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px}.tabs button{background:#fff;color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.tabs button.on{background:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;padding:0 12px}
.card{background:#fff;border:1px solid var(--line);color:var(--ink);text-align:left;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.card span{color:var(--mut);font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px;background:#fff;border-top:1px solid var(--line)}.bar button{width:100%;padding:14px}
dialog{width:min(560px,100%);max-height:92vh;border:0;border-radius:12px;padding:16px;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:#0008}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.q{display:flex;align-items:center;gap:8px}.q button{padding:4px 12px;background:#fff;color:var(--ink);border:1px solid var(--line)}
.disc{color:var(--hot)}.tot{font-size:20px;font-weight:700}
input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff;margin:4px 0}
#ban{position:fixed;top:56px;left:12px;right:12px;z-index:5;background:var(--hot);color:#fff;padding:10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.hr{width:100%;background:none;color:var(--ink);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0;display:flex;justify-content:space-between;text-align:left}.vd{text-decoration:line-through;color:var(--mut)}
#tk{flex-basis:100%;overflow:hidden;white-space:nowrap;font-size:14px;background:#ffffff1f;border-radius:6px;padding:5px 0}#tk span{display:inline-block;padding-left:100%;animation:mq var(--d,20s) linear infinite}@keyframes mq{to{transform:translateX(-100%)}}@media(prefers-reduced-motion:reduce){#tk span{animation:none;padding:0 8px}}
label{display:block;font-size:14px;margin-top:6px}#rc{display:none}
@media print{body>*:not(#rc){display:none!important}body{padding:0}#rc{display:block;width:58mm;font:12px/1.3 monospace;color:#000;background:#fff}@page{margin:2mm}.rr{display:flex;justify-content:space-between;gap:6px}#rc hr{border:0;border-top:1px dashed #000}}
#login{max-width:360px;margin:15vh auto;padding:16px}
</style></head><body>
<div id="login" hidden><h2>Kasir Eyang</h2><input id="em" placeholder="Nama atau email" autocapitalize="none" autocomplete="username"><input id="pw" type="password" placeholder="Password"><button id="go" style="width:100%">Masuk</button><p id="err" class="disc"></p></div>
<div id="app" hidden>
<header><b>Kasir Eyang</b><small id="who"></small><small id="st"></small><button class="o" id="sy">Sync</button><button class="o" id="hi">Riwayat</button><button class="o" id="eb">Belanja</button><button class="o" id="lp" hidden>Laporan</button><button class="o" id="mb" hidden>Menu</button><button class="o" id="sf" hidden>Staf</button><button class="o" id="lo">Keluar</button><div id="tk" hidden></div></header>
<div class="tabs" id="tabs"></div><div class="grid" id="grid"></div>
<div class="bar"><button id="cb"></button></div>
</div>
<div id="ban" hidden><span>Update tersedia</span><button id="upd" class="o">Muat ulang</button></div>
<dialog id="dc"><div id="lines"></div><div id="mans"></div><div id="sum"></div>
<select id="pm"><option value="cash">Tunai</option><option value="qris">QRIS</option><option value="other">Lainnya</option></select>
<input id="cash" class="money" inputmode="numeric" placeholder="Uang diterima"><div id="chg"></div><label class="row"><span>Cetak struk</span><input type="checkbox" id="pc" style="width:auto"></label>
<div style="display:flex;gap:8px;margin-top:8px"><button class="o" style="color:var(--ink)" id="cl">Tutup</button><button id="sv" style="flex:1">Simpan transaksi</button></div></dialog>
<dialog id="de"><h3>Catat belanja</h3><select id="ec"><option value="bahan">Bahan baku</option><option value="operasional">Operasional</option><option value="lain">Lain-lain</option></select><input id="ed" placeholder="Beli apa? (mis. susu 3 liter)"><input id="ea" class="money" inputmode="numeric" placeholder="Jumlah (Rp)"><div style="display:flex;gap:8px;margin-top:8px"><button class="o" style="color:var(--ink)" id="ex0">Tutup</button><button id="es" style="flex:1">Simpan belanja</button></div></dialog>
<dialog id="ds"><h3>Staf</h3><div id="sl"></div><input id="sfn" placeholder="Nama (tampil di header & struk)"><input id="sn" placeholder="ID login (huruf kecil/angka, tanpa spasi)" autocapitalize="none"><input id="sp" placeholder="Password (min. 6)"><button id="sa" style="width:100%">Tambah staf</button><p id="sm" class="disc"></p><button class="o" style="color:var(--ink);margin-top:8px" id="sc">Tutup</button></dialog>
<dialog id="dm"><div class="tabs" id="mt"></div><div id="ml" style="max-height:28vh;overflow:auto"></div><h3 id="mh"></h3><div id="mf"></div><p id="mm" class="disc"></p><div style="display:flex;gap:8px;margin-top:8px"><button class="o" style="color:var(--ink)" id="mx">Tutup</button><button class="o" style="color:var(--ink)" id="mn">Baru</button><button id="ms" style="flex:1">Simpan</button></div></dialog>
<div id="rc"></div>
<dialog id="dh"><div id="hist"></div><button class="o" style="color:var(--ink);margin-top:8px" id="hc">Tutup</button></dialog>
<script src="config.js"></script>
<script>
const C=CONFIG,$=s=>document.querySelector(s),rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
let M=[],D=[],cat='Semua',cart=new Map(),manual=new Set(),ses=JSON.parse(localStorage.getItem('ses')||'null');
// ---- IndexedDB
const db=new Promise((ok,no)=>{const r=indexedDB.open('kasir',2);r.onupgradeneeded=()=>['menu','discounts','tx','exp'].forEach(s=>r.result.objectStoreNames.contains(s)||r.result.createObjectStore(s,{keyPath:'id'}));r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idb=async(s,m,...a)=>{const d=await db;return new Promise((ok,no)=>{const q=d.transaction(s,/get/.test(m)?'readonly':'readwrite').objectStore(s)[m](...a);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})};
// ---- Supabase (REST, tanpa library)
async function auth(body,grant){const r=await fetch(`${C.URL}/auth/v1/token?grant_type=${grant}`,{method:'POST',headers:{apikey:C.KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Login gagal');ses={...j,exp:Date.now()+j.expires_in*1000};localStorage.setItem('ses',JSON.stringify(ses))}
async function api(path,opt={}){if(Date.now()>ses.exp-60000)await auth({refresh_token:ses.refresh_token},'refresh_token');const r=await fetch(`${C.URL}/rest/v1/${path}`,{...opt,headers:{apikey:C.KEY,Authorization:'Bearer '+ses.access_token,'Content-Type':'application/json',...opt.headers}});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null}
async function pull(){const since=encodeURIComponent(new Date(Date.now()-14*864e5).toISOString());const[m,d,T,E,S]=await Promise.all([api('menu_items?is_active=eq.true&order=category,name'),api('discounts?is_active=eq.true'),api('transactions?select=*,transaction_items(*),transaction_discounts(*)&created_at=gte.'+since),api('expenses?created_at=gte.'+since),api('settings?key=eq.ticker').catch(()=>null)]);await idb('menu','clear');await idb('discounts','clear');for(const x of m)await idb('menu','put',x);for(const x of d)await idb('discounts','put',x);for(const{transaction_items:items,transaction_discounts:discs,...h}of T)await idb('tx','put',{id:h.id,h,items,discs,synced:1});for(const e of E)await idb('exp','put',{...e,synced:1});if(S&&S[0])localStorage.ticker=S[0].value}
async function push(){const h={Prefer:'resolution=ignore-duplicates,return=minimal'},p=(t,b)=>b.length&&api(t+'?on_conflict=id',{method:'POST',headers:h,body:JSON.stringify(b)});
for(const t of(await idb('tx','getAll')).filter(t=>!t.synced)){await p('transactions',[t.h]);await p('transaction_items',t.items);await p('transaction_discounts',t.discs);t.synced=1;await idb('tx','put',t)}
for(const t of(await idb('tx','getAll')).filter(t=>t.vp)){await api('transactions?id=eq.'+t.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({voided_at:t.h.voided_at,void_reason:t.h.void_reason})});t.vp=0;await idb('tx','put',t)}
for(const e of(await idb('exp','getAll')).filter(e=>!e.synced)){await p('expenses',[{id:e.id,created_at:e.created_at,category:e.category,description:e.description,amount:e.amount}]);e.synced=1;await idb('exp','put',e)}}
async function sync(){if(!ses)return;$('#st').textContent='Sync...';try{await push();await pull();await load();$('#st').textContent='Tersinkron'}catch(e){console.error(e);$('#st').textContent=navigator.onLine?'Sync gagal':'Offline'}}
async function load(){M=await idb('menu','getAll');D=await idb('discounts','getAll');render()}
// ---- Diskon
function ok(d,n=new Date()){const t=n.toLocaleDateString('sv'),hm=n.toTimeString().slice(0,8);
if(d.valid_from&&t<d.valid_from||d.valid_until&&t>d.valid_until)return false;
if(d.days_of_week&&!d.days_of_week.includes(n.getDay()))return false;
if(d.start_time&&hm<d.start_time||d.end_time&&hm>=d.end_time)return false;return true}
function calc(d,L){const m=L.filter(l=>d.scope==='order'||d.scope==='category'&&l.category===d.scope_category||d.scope==='item'&&l.id===d.scope_item_id);
const q=m.reduce((a,l)=>a+l.qty,0),s=m.reduce((a,l)=>a+l.qty*l.price,0);if(!q||q<(d.min_qty||0))return 0;
if(d.type==='percent')return Math.round(s*d.value/100);if(d.type==='amount')return Math.min(d.value,s);
if(d.type==='buy_x_get_y'){const g=d.buy_qty+d.free_qty;return m.reduce((a,l)=>a+Math.floor(l.qty/g)*d.free_qty*l.price,0)}return 0}
function discounts(){const L=[...cart.values()],c=D.filter(d=>ok(d)&&(d.auto_apply||manual.has(d.id))).map(d=>({d,a:calc(d,L)})).filter(x=>x.a>0);
const ns=c.filter(x=>!x.d.stackable).sort((a,b)=>b.a-a.a||b.d.priority-a.d.priority);return[...ns.slice(0,1),...c.filter(x=>x.d.stackable)]}
const sub=()=>[...cart.values()].reduce((a,l)=>a+l.qty*l.price,0),qty=()=>[...cart.values()].reduce((a,l)=>a+l.qty,0);
// ---- UI
function render(){const cats=['Semua',...new Set(M.map(m=>m.category))];
$('#tabs').innerHTML=cats.map(c=>`<button class="${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('');
$('#grid').innerHTML=M.filter(m=>cat==='Semua'||m.category===cat).map(m=>`<button class="card" data-i="${m.id}">${m.name}<span>${rp(m.price)}</span></button>`).join('')||'<p style="grid-column:1/-1">Menu kosong. Isi tabel menu_items di Supabase lalu tekan Sync.</p>';
const dt=Math.min(sub(),discounts().reduce((a,x)=>a+x.a,0));$('#cb').textContent=qty()?`Keranjang (${qty()}) · ${rp(sub()-dt)}`:'Keranjang kosong';tick()}
function cartUI(){const ds=discounts(),dt=Math.min(sub(),ds.reduce((a,x)=>a+x.a,0)),tot=sub()-dt;
$('#lines').innerHTML=[...cart.values()].map(l=>`<div class="row"><div>${l.name}<br><small>${rp(l.price)}</small></div><div class="q"><button data-m="${l.id}">−</button>${l.qty}<button data-p="${l.id}">+</button></div></div>`).join('');
$('#mans').innerHTML=D.filter(d=>!d.auto_apply&&ok(d)).map(d=>`<label class="row"><span>${d.name}</span><input type="checkbox" style="width:auto" data-d="${d.id}" ${manual.has(d.id)?'checked':''}></label>`).join('');
$('#sum').innerHTML=`<div class="row"><span>Subtotal</span>${rp(sub())}</div>`+ds.map(x=>`<div class="row disc"><span>${x.d.name}</span>−${rp(x.a)}</div>`).join('')+`<div class="row tot"><span>Total</span>${rp(tot)}</div>`;
const c=num($('#cash'));$('#chg').textContent=$('#pm').value==='cash'&&c?(c>=tot?'Kembalian '+rp(c-tot):'Uang kurang'):'';$('#cash').hidden=$('#pm').value!=='cash';$('#sv').disabled=!cart.size}
async function save(){const L=[...cart.values()],ds=discounts(),s=sub(),dt=Math.min(s,ds.reduce((a,x)=>a+x.a,0)),id=crypto.randomUUID(),n=new Date(),p=n.toLocaleDateString('sv').replace(/-/g,'')+'-'+n.toTimeString().slice(0,8).replace(/:/g,'');
const pay=$('#pm').value,h={id,receipt_no:p,created_at:n.toISOString(),subtotal:s,discount_total:dt,total:s-dt,payment_method:pay,cash_received:pay==='cash'?(num($('#cash'))||s-dt):null,note:null};
const items=L.map(l=>({id:crypto.randomUUID(),transaction_id:id,menu_item_id:l.id,item_name:l.name,unit_price:l.price,qty:l.qty,line_total:l.price*l.qty}));
const discs=ds.map(x=>({id:crypto.randomUUID(),transaction_id:id,discount_id:x.d.id,discount_name:x.d.name,transaction_item_id:null,amount:x.a,is_manual:!x.d.auto_apply}));
await idb('tx','put',{id,h,items,discs,synced:0});if($('#pc').checked)printRc(h,items,discs);cart.clear();manual.clear();$('#cash').value='';$('#dc').close();render();sync()}
async function history(){const today=new Date().toLocaleDateString('sv'),T=(await idb('tx','getAll')).filter(t=>t.h.created_at&&new Date(t.h.created_at).toLocaleDateString('sv')===today).sort((a,b)=>b.h.created_at.localeCompare(a.h.created_at));
const A=T.filter(t=>!t.h.voided_at),ow=prof.role==='owner',E=(await idb('exp','getAll')).filter(e=>new Date(e.created_at).toLocaleDateString('sv')===today).sort((a,b)=>b.created_at.localeCompare(a.created_at));
$('#hist').innerHTML=`<h3>Hari ini: ${rp(A.reduce((a,t)=>a+t.h.total,0))} (${A.length} transaksi)</h3>${ow?'<small>Tap transaksi untuk membatalkan</small>':''}`+T.map(t=>`<button class="hr ${t.h.voided_at?'vd':''}" ${ow?`data-v="${t.id}"`:''}><span>${t.h.receipt_no.slice(-6)} · ${t.items.reduce((a,i)=>a+i.qty,0)} item${t.h.voided_at?' · BATAL':t.synced&&!t.vp?'':' · belum sync'}</span>${rp(t.h.total)}</button>`).join('')+(E.length?`<h3>Belanja: ${rp(E.reduce((a,e)=>a+e.amount,0))}</h3>`+E.map(e=>`<div class="row"><span>${esc(e.description)}${e.synced?'':' · belum sync'}</span>${rp(e.amount)}</div>`).join(''):'');
if(!$('#dh').open)$('#dh').showModal()}
async function voidTx(id){if(prof.role!=='owner')return;const t=await idb('tx','get',id);if(t.h.voided_at)return;
if(!confirm(`Batalkan ${t.h.receipt_no.slice(-6)}?\n${t.items.map(i=>i.qty+'x '+i.item_name).join(', ')}\nTotal ${rp(t.h.total)}`))return;
const r=prompt('Alasan batal (mis. salah input)');if(r===null)return;
t.h.voided_at=new Date().toISOString();t.h.void_reason=r||'-';t.vp=1;await idb('tx','put',t);history();sync()}
document.addEventListener('click',e=>{const t=e.target.closest('button,input');if(!t)return;const d=t.dataset;
if(d.v)voidTx(d.v);
if(d.k){K=d.k;mOpen()}
if(d.ed!==undefined)fill(ROWS[d.ed]);
if(d.pw){const p=prompt('Password baru (min. 6 karakter)');if(p)fn({action:'set_password',id:d.pw,password:p}).then(()=>alert('Password diubah')).catch(e=>alert(e.message))}
if(d.nm){const n=prompt('Nama tampilan baru');if(n&&n.trim())fn({action:'set_name',id:d.nm,full_name:n.trim()}).then(staffList).catch(e=>alert(e.message))}
if(d.act)fn({action:'set_active',id:d.act,active:d.on==='1'}).then(staffList).catch(e=>alert(e.message));
if(d.c){cat=d.c;render()}
if(d.i){const m=M.find(x=>x.id===d.i),l=cart.get(m.id);l?l.qty++:cart.set(m.id,{id:m.id,name:m.name,category:m.category,price:m.price,qty:1});render()}
if(d.p||d.m){const l=cart.get(d.p||d.m);l.qty+=d.p?1:-1;if(l.qty<1)cart.delete(l.id);render();cartUI()}
if(d.d){t.checked?manual.add(d.d):manual.delete(d.d);cartUI();render()}});
$('#cb').onclick=()=>{if(qty()){cartUI();$('#dc').showModal()}};$('#cl').onclick=()=>$('#dc').close();$('#hc').onclick=()=>$('#dh').close();
$('#pm').onchange=$('#cash').oninput=cartUI;$('#sv').onclick=save;$('#sy').onclick=sync;$('#hi').onclick=history;$('#lp').onclick=()=>location.href='dashboard.html';
let prof=JSON.parse(localStorage.getItem('prof')||'null');
const esc=x=>String(x).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const num=el=>+(el.value||'').replace(/\D/g,'')||0;
document.addEventListener('input',e=>{const t=e.target;if(t.classList&&t.classList.contains('money')){const v=t.value.replace(/\D/g,'');t.value=v?(+v).toLocaleString('id-ID'):''}});
async function loadProf(force){if(force)prof=null;try{const r=await api('profiles?id=eq.'+ses.user.id);if(r[0]&&r[0].active){prof=r[0];localStorage.setItem('prof',JSON.stringify(prof))}else{prof=null;localStorage.removeItem('prof')}}catch(e){}}
$('#go').onclick=async()=>{try{const u=$('#em').value.trim().toLowerCase();await auth({email:u.includes('@')?u:u+'@staff.eyang.id',password:$('#pw').value},'password');await loadProf(true);if(!prof)throw new Error('Akun belum terdaftar atau tidak aktif');const old=localStorage.getItem('uid');if(old&&old!==ses.user.id){await idb('tx','clear');await idb('exp','clear')}localStorage.setItem('uid',ses.user.id);start()}catch(e){$('#err').textContent=e.message}};
async function start(){if(ses&&navigator.onLine)await loadProf();if(ses&&!prof){localStorage.removeItem('ses');ses=null}
$('#login').hidden=!!ses;$('#app').hidden=!ses;if(!ses)return;$('#who').textContent=prof.full_name||prof.name;$('#lp').hidden=$('#sf').hidden=$('#mb').hidden=prof.role!=='owner';await load();sync()}
$('#eb').onclick=()=>{$('#ed').value=$('#ea').value='';$('#de').showModal()};$('#ex0').onclick=()=>$('#de').close();
$('#es').onclick=async()=>{const a=num($('#ea')),d=$('#ed').value.trim();if(!d||!(a>0))return alert('Isi keterangan dan jumlah');await idb('exp','put',{id:crypto.randomUUID(),created_at:new Date().toISOString(),category:$('#ec').value,description:d,amount:a,synced:0});$('#de').close();sync()};
$('#lo').onclick=async()=>{if(!confirm('Keluar dari akun ini?'))return;try{await push()}catch(e){return alert('Masih ada data belum tersinkron. Online dulu, lalu coba lagi.')}['ses','prof','uid'].forEach(k=>localStorage.removeItem(k));await idb('tx','clear');await idb('exp','clear');location.reload()};
async function fn(body){if(Date.now()>ses.exp-60000)await auth({refresh_token:ses.refresh_token},'refresh_token');const r=await fetch(C.URL+'/functions/v1/staff',{method:'POST',headers:{apikey:C.KEY,Authorization:'Bearer '+ses.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.message||'Gagal ('+r.status+')');return j}
async function staffList(){try{const L=await api('profiles?role=eq.staff&order=name');$('#sl').innerHTML=L.map(x=>`<div class="row"><span>${esc(x.full_name||x.name)} <small>(${esc(x.name)})</small>${x.active?'':' · nonaktif'}</span><span><button data-nm="${x.id}">Nama</button> <button data-pw="${x.id}">Password</button> <button data-act="${x.id}" data-on="${x.active?0:1}">${x.active?'Nonaktifkan':'Aktifkan'}</button></span></div>`).join('')||'<p>Belum ada staf.</p>'}catch(e){$('#sl').textContent='Gagal memuat (online?)'}}
$('#sa').onclick=async()=>{$('#sm').textContent='';try{await fn({action:'create',name:$('#sn').value.trim().toLowerCase(),full_name:$('#sfn').value.trim(),password:$('#sp').value});$('#sn').value=$('#sp').value=$('#sfn').value='';staffList()}catch(e){$('#sm').textContent=e.message}};
$('#sf').onclick=()=>{staffList();$('#ds').showModal()};$('#sc').onclick=()=>$('#ds').close();
// ---- Struk (cetak lewat dialog print browser / RawBT)
const PM2={cash:'Tunai',qris:'QRIS',other:'Lainnya'};$('#pc').checked=localStorage.pc==='1';$('#pc').onchange=()=>localStorage.pc=$('#pc').checked?1:0;
function printRc(h,items,discs){const n=new Date(h.created_at),R=(a,b)=>`<div class="rr"><span>${a}</span><span>${b}</span></div>`,pay=h.cash_received||h.total;
$('#rc').innerHTML=`<b>Kedai Kopi Eyang</b><br>${n.toLocaleDateString('id-ID')} ${n.toTimeString().slice(0,5)}<br>${h.receipt_no} · ${esc(prof.full_name||prof.name)}<hr>`+items.map(i=>`${esc(i.item_name)}${R(i.qty+' x '+rp(i.unit_price),rp(i.line_total))}`).join('')+'<hr>'+R('Subtotal',rp(h.subtotal))+discs.map(d=>R(esc(d.discount_name),'-'+rp(d.amount))).join('')+R('<b>TOTAL</b>','<b>'+rp(h.total)+'</b>')+R(PM2[h.payment_method],rp(pay))+(h.payment_method==='cash'?R('Kembali',rp(pay-h.total)):'')+'<hr><center>Terima kasih!</center>';setTimeout(()=>print(),200)}
// ---- Kelola menu & diskon (owner)
let K='menu',ED=null,ROWS=[];
const F={menu:{t:'menu_items',f:[['name','Nama','text'],['category','Kategori','text'],['price','Harga (Rp)','money'],['is_active','Aktif','check']]},
disc:{t:'discounts',f:[['name','Nama','text'],['type','Tipe','select:percent,amount,buy_x_get_y'],['value','Nilai (% atau Rp)','number'],['buy_qty','Beli (qty)','number'],['free_qty','Gratis (qty)','number'],['min_qty','Min. qty','number'],['scope','Berlaku untuk','select:order,category,item'],['scope_category','Kategori (jika scope = category)','text'],['scope_item_id','Menu (jika scope = item)','menu'],['start_time','Jam mulai','time'],['end_time','Jam selesai','time'],['valid_from','Berlaku dari','date'],['valid_until','Sampai tanggal','date'],['auto_apply','Otomatis diterapkan','check'],['stackable','Boleh digabung','check'],['priority','Prioritas','number'],['is_active','Aktif','check']]}};
function formHTML(){return F[K].f.map(([k,l,t])=>{const id='f_'+k;
if(t==='check')return`<label class="row"><span>${l}</span><input type="checkbox" id="${id}" style="width:auto"></label>`;
if(t.startsWith('select:'))return`<label>${l}<select id="${id}">${t.slice(7).split(',').map(o=>`<option>${o}</option>`).join('')}</select></label>`;
if(t==='money')return`<label>${l}<input id="${id}" class="money" inputmode="numeric"></label>`;
if(t==='menu')return`<label>${l}<select id="${id}"><option value="">-</option>${M.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label>`;
return`<label>${l}<input id="${id}" type="${t}" ${t==='number'?'inputmode="decimal"':''}></label>`}).join('')}
function fill(r){ED=r&&r.id||null;$('#mm').textContent='';$('#mh').textContent=r?'Ubah: '+r.name:'Tambah baru';
F[K].f.forEach(([k,,t])=>{const e=$('#f_'+k),v=r?r[k]:(k==='is_active'||k==='auto_apply'?true:k==='priority'?0:'');if(t==='check')e.checked=!!v;else{e.value=v==null||v===''?'':t==='money'?Number(v).toLocaleString('id-ID'):v;if(e.tagName==='SELECT'&&e.selectedIndex<0)e.selectedIndex=0}})}
function collect(){const o={};for(const[k,,t]of F[K].f){const e=$('#f_'+k);o[k]=t==='check'?e.checked:t==='money'?(e.value===''?null:num(e)):t==='number'?(e.value===''?null:Number(e.value)):(e.value.trim()||null)}return o}
async function mList(){try{ROWS=await api(F[K].t+'?order=name');$('#ml').innerHTML=ROWS.map((r,i)=>`<button class="hr ${r.is_active?'':'vd'}" data-ed="${i}"><span>${esc(r.name)}${K==='menu'?' · '+esc(r.category):''}</span>${K==='menu'?rp(r.price):esc(r.type)}</button>`).join('')||'<p>Belum ada data.</p>'}catch(e){$('#ml').textContent='Gagal memuat (online?)'}}
function tick(){const el=$('#tk');if(!el)return;const msgs=(localStorage.ticker||'').split('\n').map(x=>x.trim()).filter(Boolean),pr=D.filter(d=>d.is_active!==false&&ok(d)).map(d=>d.name);if(pr.length)msgs.push('Promo aktif: '+pr.join(', '));const t=msgs.join('   •   ');if(el.dataset.t===t)return;el.dataset.t=t;el.hidden=!t;el.innerHTML='<span></span>';el.firstChild.textContent=t;el.style.setProperty('--d',Math.max(15,t.length*.22)+'s')}
setInterval(tick,60000);
function mOpen(){$('#mt').innerHTML=['menu:Menu','disc:Diskon','msg:Pesan'].map(x=>{const[k,l]=x.split(':');return`<button data-k="${k}" class="${K===k?'on':''}">${l}</button>`}).join('');
if(K==='msg'){$('#ml').innerHTML='';$('#mh').textContent='Pesan berjalan di header';$('#mf').innerHTML='<label>Satu pesan per baris. Promo yang sedang aktif ditambahkan otomatis.<textarea id="f_msg" rows="5" style="width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px"></textarea></label>';$('#f_msg').value=localStorage.ticker||'';$('#mm').textContent=''}
else{$('#mf').innerHTML=formHTML();fill(null);mList()}
if(!$('#dm').open)$('#dm').showModal()}
async function mSave(){try{if(K==='msg'){const v=$('#f_msg').value.trim();await api('settings?on_conflict=key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({key:'ticker',value:v})});localStorage.ticker=v;tick();$('#mm').textContent='Tersimpan. Staf menerimanya saat Sync.';return}const o=collect();if(!o.name)throw new Error('Nama wajib diisi');
if(K==='menu'){if(!o.category||o.price==null)throw new Error('Kategori dan harga wajib diisi');o.price=Math.round(o.price)}
else{['value','buy_qty','free_qty','min_qty','priority'].forEach(k=>o[k]!=null&&(o[k]=Math.round(o[k])));o.priority=o.priority||0;if(o.type==='buy_x_get_y'){if(!o.buy_qty||!o.free_qty)throw new Error('Isi Beli dan Gratis (qty)');o.value=null}else if(!o.value)throw new Error('Isi Nilai diskon')}
await api(F[K].t+(ED?'?id=eq.'+ED:''),{method:ED?'PATCH':'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(o)});
await mList();fill(null);$('#mm').textContent='Tersimpan';sync()}catch(e){$('#mm').textContent=e.message}}
$('#mb').onclick=mOpen;$('#mx').onclick=()=>$('#dm').close();$('#mn').onclick=()=>K==='msg'||fill(null);$('#ms').onclick=mSave;
addEventListener('online',sync);start();
// ---- PWA update
if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').then(r=>{const w=()=>r.waiting&&navigator.serviceWorker.controller&&($('#ban').hidden=false);w();r.addEventListener('updatefound',()=>r.installing.addEventListener('statechange',w));$('#upd').onclick=()=>r.waiting.postMessage('SKIP_WAITING')});
navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload())}
</script></body></html>
