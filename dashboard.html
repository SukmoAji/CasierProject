<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f3d33">
<title>Laporan Kasir Eyang</title>
<style>
:root{--bg:#f2f3ee;--ink:#1c1a17;--g:#1f3d33;--mut:#6b6f68;--line:#d9dbd2;--hot:#b4430f}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--g);color:#fff;position:sticky;top:0}
header a{color:#fff}header b{flex:1}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;background:var(--g);color:#fff}button.o{background:transparent;color:var(--g);border:1px solid var(--g)}
main{max-width:720px;margin:0 auto;padding:12px}
select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
.k{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.k div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px}
.k .split{display:flex}.k .split span{flex:1}.k .split span+span{border-left:1px solid var(--line);padding-left:12px}.k small{color:var(--mut)}.k b{display:block;font-size:20px}
#rgb{display:none;gap:8px;margin-top:8px}#rgb.on{display:flex}#rgb input{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;flex:1;min-width:0;background:#fff}

.b .t{background:#e4e6dd;height:14px;border-radius:3px;overflow:hidden}.b i{display:block;height:100%;background:var(--g)}
.b .v{text-align:right;color:var(--mut);white-space:nowrap}
.tp .b{grid-template-columns:minmax(90px,1.2fr) 1fr auto}.tp .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

</style></head><body>
<header><a href="index.html">← Kasir</a><b>Laporan</b><small id="st"></small></header>
<main>
<select id="pr"><option value="today">Hari ini</option><option value="yesterday">Kemarin</option><option value="7">7 hari terakhir</option><option value="month">Bulan ini</option><option value="last">Bulan lalu</option><option value="range">Pilih tanggal</option></select>
<div id="rgb"><input type="date" id="d1"><input type="date" id="d2"></div>
<select id="bq" style="margin-top:8px"></select>
<div style="display:flex;gap:8px;margin-top:8px"><button id="xl">Unduh Excel</button><button id="bk" class="o">Backup data (JSON)</button></div>
<div id="out"></div>
</main>
<script src="config.js"></script>
<script>
const C=CONFIG,$=s=>document.querySelector(s),rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
let ses=JSON.parse(localStorage.getItem('ses')||'null');const prof=JSON.parse(localStorage.getItem('prof')||'null');if(!ses||!prof)location.href='index.html';const FULL=!!prof&&prof.role!=='staff',OWNR=!!prof&&prof.role==='owner';
async function api(path,opt={}){if(Date.now()>ses.exp-60000){const r=await fetch(`${C.URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:C.KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:ses.refresh_token})});const j=await r.json();if(!r.ok){location.href='index.html';return}ses={...j,exp:Date.now()+j.expires_in*1000};localStorage.setItem('ses',JSON.stringify(ses))}
const r=await fetch(`${C.URL}/rest/v1/${path}`,{...opt,headers:{apikey:C.KEY,Authorization:'Bearer '+ses.access_token,'Content-Type':'application/json',...opt.headers}});const x=await r.text();if(!r.ok)throw new Error(x);return x?JSON.parse(x):null}
const pd=v=>{const[y,m,x]=v.split('-').map(Number);return new Date(y,m-1,x)};
const rgc=()=>{const s=$('#d1').value?pd($('#d1').value):new Date(new Date().setHours(0,0,0,0)),t=$('#d2').value?pd($('#d2').value):s;let e=new Date(t.getFullYear(),t.getMonth(),t.getDate()+1);if(e<=s)e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+1);return[s,e]};
const rg=p=>{const n=new Date(),y=n.getFullYear(),m=n.getMonth(),t=n.getDate(),d=(a,b,c)=>new Date(a,b,c);
return p==='today'?[d(y,m,t),d(y,m,t+1)]:p==='yesterday'?[d(y,m,t-1),d(y,m,t)]:p==='7'?[d(y,m,t-6),d(y,m,t+1)]:p==='month'?[d(y,m,1),d(y,m+1,1)]:p==='range'?rgc():[d(y,m-1,1),d(y,m,1)]};
async function fetchAll(p){const[a,b]=rg(p);let all=[],o=0;for(;;){const r=await api(`transactions?select=id,branch_id,receipt_no,created_at,subtotal,total,discount_total,payment_method,voided_at,void_reason,voided_by,created_by,transaction_items(menu_item_id,item_name,qty,unit_price,line_total)&created_at=gte.${encodeURIComponent(a.toISOString())}&created_at=lt.${encodeURIComponent(b.toISOString())}&order=created_at${bf()}&limit=1000&offset=${o}`);all=all.concat(r);if(r.length<1000)break;o+=1000}return all}
const bf=()=>$('#bq').value==='all'?'':'&branch_id=eq.'+$('#bq').value;
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0),grp=(a,k)=>a.reduce((m,x)=>{(m[k(x)]=m[k(x)]||[]).push(x);return m},{});
const bars=rows=>{const mx=Math.max(...rows.map(r=>r[1]),1);return rows.map(([l,v,t])=>`<div class="b"><span class="l">${l}</span><div class="t"><i style="width:${v/mx*100}%"></i></div><span class="v">${t}</span></div>`).join('')};
const esc=x=>String(x).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),EC={bahan:'Bahan baku',operasional:'Operasional',lain:'Lain-lain'};
const fetchEx=p=>{const[a,b]=rg(p);return api(`expenses?select=id,branch_id,created_at,category,description,amount,pay_method,created_by&created_at=gte.${encodeURIComponent(a.toISOString())}&created_at=lt.${encodeURIComponent(b.toISOString())}&order=created_at${bf()}&limit=1000`)};
let BRS=[],LAST={all:[],ex:[],ok:[]},CM={},NM={};
const fetchCD=p=>{const[a,b]=rg(p),f=x=>x.toLocaleDateString('sv');return api(`cash_days?day=gte.${f(a)}&day=lt.${f(b)}${bf()}&order=day.desc`)};
function kasHtml(ok,ex,cdr){const k={},get=(b,x)=>k[b+'|'+x]=k[b+'|'+x]||{b,d:x,cs:0,qs:0,ce:0,qe:0,cd:null},dd=iso=>new Date(iso).toLocaleDateString('sv');
ok.forEach(t=>{const r=get(t.branch_id,dd(t.created_at));if(t.payment_method==='cash')r.cs+=t.total;else if(t.payment_method==='qris')r.qs+=t.total});
ex.forEach(e=>{const r=get(e.branch_id,dd(e.created_at));if(e.pay_method==='qris')r.qe+=e.amount;else r.ce+=e.amount});
cdr.forEach(c=>{get(c.branch_id,c.day).cd=c});
const multi=$('#bq').value==='all'&&BRS.length>1,rows=Object.values(k).sort((a,c)=>c.d.localeCompare(a.d)||a.b.localeCompare(c.b)).map(r=>{const c=r.cd,cl=c&&c.closed_at,op=c?c.opening_cash:null;r.op=op;r.ec=(op||0)+r.cs-r.ce;r.eq=r.qs-r.qe;r.dc=cl?c.counted_cash-r.ec:null;r.dq=cl&&c.counted_qris!=null?c.counted_qris-r.eq:null;return r});
if(!rows.length)return'';
const sd=x=>x==null?'':x===0?' · <b>selisih 0</b>':` · <b style="color:var(--hot)">selisih ${x>0?'+':''}${rp(x)}</b>`,tc=sum(rows.filter(r=>r.dc!=null),r=>r.dc),tq=sum(rows.filter(r=>r.dq!=null),r=>r.dq);
return'<h3>Kas harian</h3><p class="mut" style="margin:0 0 4px">Total selisih (hari yang sudah closing): tunai '+rp(tc)+' · QRIS '+rp(tq)+'</p><div id="kas" style="border:1px solid var(--line);border-radius:10px;padding:0 8px;overflow-y:auto;background:#ffffff80">'+rows.map(r=>{const c=r.cd,cl=c&&c.closed_at,st=!c?'⚠ kas awal belum diisi':cl?'✓ closing':'⚠ belum closing';
return`<div style="background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:14px"><div><b>${r.d.slice(5)}</b>${multi?' · '+esc((BRS.find(b=>b.id===r.b)||{}).name||''):''} <small class="mut">${st}${cl?' · '+esc(NM[c.closed_by]||''):''}</small></div><div>Tunai: awal ${r.op==null?'-':rp(r.op)} + jual ${rp(r.cs)} − belanja ${rp(r.ce)} = <b>${rp(r.ec)}</b>${cl?' · dihitung '+rp(c.counted_cash)+sd(r.dc):''}</div><div>QRIS: jual ${rp(r.qs)} − belanja ${rp(r.qe)} = <b>${rp(r.eq)}</b>${r.dq!=null?' · dihitung '+rp(c.counted_qris)+sd(r.dq):''}</div>${c&&c.note?`<div class="mut">Catatan: ${esc(c.note)}</div>`:''}</div>`}).join('')+'</div>'+(rows.length>5?'<p class="mut" style="margin:4px 0">Geser ke bawah untuk hari sebelumnya</p>':'')}
function fitKas(){const b=$('#kas');if(!b||b.children.length<=5)return;b.style.maxHeight=[...b.children].slice(0,5).reduce((a,x)=>a+x.offsetHeight+6,6)+'px'}
function col(rows,n){const W=Math.max(300,rows.length*(n>1?30:24)+44),H=160,L=40,Bt=22,T0=8,ph=H-Bt-T0,mx=Math.max(...rows.flatMap(r=>r.slice(1)),1),bw=(W-L-6)/rows.length,gw=bw*.78/n,step=Math.ceil(rows.length/14),cl=['var(--g)','var(--hot)'],fm=v=>v>=1e6?(v/1e6).toFixed(1).replace('.0','')+'jt':v>=1e3?Math.round(v/1e3)+'rb':v;
let s=`<text x="0" y="${T0+8}" font-size="10" fill="#6b6f68">${fm(mx)}</text><text x="0" y="${T0+ph}" font-size="10" fill="#6b6f68">0</text><line x1="${L-4}" x2="${W}" y1="${T0+ph}" y2="${T0+ph}" stroke="#d9dbd2"/>`;
rows.forEach((r,i)=>{const x0=L+i*bw+bw*.11;for(let k=0;k<n;k++){const v=r[k+1],h=v/mx*ph;s+=`<rect x="${(x0+k*gw).toFixed(1)}" y="${(T0+ph-h).toFixed(1)}" width="${(gw-1).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${cl[k]}"><title>${esc(r[0])}: ${rp(v)}</title></rect>`}if(i%step===0)s+=`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-6}" font-size="9" text-anchor="middle" fill="#6b6f68">${esc(r[0])}</text>`});
return`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" style="max-width:none">${s}</svg></div>`}
function donut(rows){const T=sum(rows,r=>r[1])||1,C=2*Math.PI*40,pal=['#1f3d33','#b4430f','#6b6f68','#8aa399'];let off=0;
const arcs=rows.map((r,i)=>{const len=r[1]/T*C,x=`<circle r="40" cx="60" cy="60" fill="none" stroke="${pal[i%4]}" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`;off+=len;return x}).join('');
return`<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 120 120" width="120" height="120" role="img">${arcs}</svg><div style="font-size:14px">`+rows.map((r,i)=>`<div><span style="display:inline-block;width:10px;height:10px;background:${pal[i%4]};border-radius:2px"></span> ${r[0]}: <b>${rp(r[1])}</b> (${Math.round(r[1]/T*100)}%)</div>`).join('')+'</div></div>'}
const PM={cash:'Tunai',qris:'QRIS',other:'Lainnya'};
function ttl(){if(!FULL){const b=JSON.parse(localStorage.getItem('branches')||'[]').find(x=>x.id===prof.branch_id);document.title='Laporan'+(b?' · '+b.name:'');return}const o=$('#bq').selectedOptions[0];document.title='Laporan'+(o?' · '+o.textContent:'')}
async function load(){ttl();if(!FULL)return loadStaff();$('#st').textContent='Memuat...';try{
const[all,ex,mn,pf,cdr]=await Promise.all([fetchAll($('#pr').value),fetchEx($('#pr').value),api('menu_items?select=id,category&limit=1000'),api('profiles?select=id,name,full_name'),fetchCD($('#pr').value).catch(()=>[])]),ok=all.filter(t=>!t.voided_at),vd=all.length-ok.length;
LAST={all,ex,ok};CM=Object.fromEntries(mn.map(m=>[m.id,m.category]));NM=Object.fromEntries(pf.map(p=>[p.id,p.full_name||p.name]));if(!ok.length&&!ex.length){$('#out').innerHTML='<p class="mut">Belum ada transaksi di periode ini.</p>';$('#st').textContent='';return}
const om=sum(ok,t=>t.total);
let h=`<div class="k"><div><small>Omzet</small><b>${rp(om)}</b></div><div class="split"><span><small>Transaksi</small><b>${ok.length}</b></span><span><small>Total cup</small><b id="kc">-</b></span></div><div><small>Rata-rata/transaksi</small><b>${rp(ok.length?om/ok.length:0)}</b></div><div><small>Total diskon</small><b>${rp(sum(ok,t=>t.discount_total))}</b></div><div><small>Belanja</small><b>${rp(sum(ex,e=>e.amount))}</b><small>Tunai ${rp(sum(ex.filter(e=>e.pay_method!=='qris'),e=>e.amount))} · QRIS ${rp(sum(ex.filter(e=>e.pay_method==='qris'),e=>e.amount))}</small></div><div><small>Omzet − belanja</small><b>${rp(om-sum(ex,e=>e.amount))}</b></div></div>`;
if(vd)h+=`<p class="mut">${vd} transaksi dibatalkan (tidak dihitung)</p>`;
if(vd)h+='<h3>Dibatalkan</h3>'+all.filter(t=>t.voided_at).map(t=>`<div class="b" style="grid-template-columns:1fr auto"><span>${esc(t.receipt_no.slice(-6))} · ${esc(NM[t.created_by]||'-')} <small class="mut">· ${esc(t.void_reason||'-')} (oleh ${esc(NM[t.voided_by]||'owner')})</small></span><span class="v">${rp(t.total)}</span></div>`).join('');
h+=kasHtml(ok,ex,cdr||[]);
h+='<h3>Cup terjual</h3><div id="cup"></div>';
if($('#bq').value==='all'&&BRS.length>1){const bg=grp(ok,t=>t.branch_id);h+='<h3>Per cabang</h3>'+bars(BRS.map(b=>[esc(b.name),sum(bg[b.id]||[],t=>t.total),`${rp(sum(bg[b.id]||[],t=>t.total))} · ${(bg[b.id]||[]).length}x`]))}
const pg=grp(ok,t=>t.payment_method);h+='<h3>Metode bayar</h3>'+donut(Object.entries(pg).map(([k,a])=>[PM[k]||esc(k),sum(a,t=>t.total)]));
const dg=grp(ok,t=>new Date(t.created_at).toLocaleDateString('sv'));if(Object.keys(dg).length>1){const eg2=grp(ex,e=>new Date(e.created_at).toLocaleDateString('sv'));h+='<h3>Omzet &amp; belanja per hari</h3><p class="mut" style="margin:0"><span style="color:var(--g)">■</span> omzet &nbsp; <span style="color:var(--hot)">■</span> belanja</p>'+col(Object.keys({...dg,...eg2}).sort().map(k=>[k.slice(5),sum(dg[k]||[],t=>t.total),sum(eg2[k]||[],e=>e.amount)]),2)}
const hg=grp(ok,t=>new Date(t.created_at).getHours()),hs=Object.keys(hg).map(Number),r=[];for(let i=Math.min(...hs);i<=Math.max(...hs);i++){const a=hg[i]||[];r.push([i+':00',sum(a,t=>t.total),`${rp(sum(a,t=>t.total))} · ${a.length}x`])}
h+='<h3>Jam ramai (omzet)</h3>'+col(r.map(x=>[x[0],x[1]]),1);
const im={};ok.forEach(t=>(t.transaction_items||[]).forEach(i=>{const x=im[i.item_name]=im[i.item_name]||{q:0,o:0};x.q+=i.qty;x.o+=i.line_total}));
h+='<h3>Menu terlaris</h3><div class="tp">'+bars(Object.entries(im).sort((a,b)=>b[1].q-a[1].q).slice(0,10).map(([n,x])=>[n,x.q,`${x.q}x · ${rp(x.o)}`]))+'</div>';
if(ex.length){const eg=grp(ex,e=>e.category);h+='<h3>Belanja per kategori</h3>'+bars(Object.entries(eg).map(([k,a])=>[EC[k]||esc(k),sum(a,e=>e.amount),rp(sum(a,e=>e.amount))]))+'<h3>Daftar belanja</h3>'+ex.slice().reverse().slice(0,30).map(e=>`<div class="b" style="grid-template-columns:50px 1fr auto"><span class="l">${new Date(e.created_at).toLocaleDateString('sv').slice(5)}</span><span>${esc(e.description)}</span><span class="v">${rp(e.amount)}</span></div>`).join('')}
$('#out').innerHTML=h;renderCup();fitKas();$('#st').textContent=''}catch(e){console.error(e);$('#out').innerHTML='<p class="err">Gagal memuat. Pastikan online, lalu pilih periode lagi.</p>';$('#st').textContent=''}}
async function loadStaff(){$('#st').textContent='Memuat...';try{const[a,b]=rg($('#pr').value),[r,cc]=await Promise.all([api('rpc/staff_report',{method:'POST',body:JSON.stringify({b:prof.branch_id,d1:a.toISOString(),d2:b.toISOString()})}),api('settings?key=eq.cupcats').catch(()=>[])]);
const cats=r.cats||{},names=Object.keys(cats),saved=cc&&cc[0]?JSON.parse(cc[0].value):null,on=saved||names.filter(c=>!/makan|food|snack|roti|cemil/i.test(c)),cup=names.filter(c=>on.includes(c)).reduce((s,c)=>s+cats[c],0),ex=r.exp||[];
let h=`<div class="k"><div class="split"><span><small>Transaksi</small><b>${r.trx}</b></span><span><small>Total cup</small><b>${cup}</b></span></div><div><small>Belanja</small><b>${rp(sum(ex,e=>e.amt))}</b><small>Tunai ${rp(sum(ex.filter(e=>e.pm!=='qris'),e=>e.amt))} · QRIS ${rp(sum(ex.filter(e=>e.pm==='qris'),e=>e.amt))}</small></div></div>`;
if(r.voided)h+=`<p class="mut">${r.voided} transaksi dibatalkan (tidak dihitung)</p>`;
h+='<h3>Metode bayar</h3>'+bars(Object.entries(r.pay||{}).map(([k,v])=>[PM[k]||esc(k),v,rp(v)]));
if(ex.length)h+='<h3>Daftar belanja</h3>'+ex.slice(0,50).map(e=>`<div class="b" style="grid-template-columns:50px 1fr auto"><span class="l">${new Date(e.at).toLocaleDateString('sv').slice(5)}</span><span>${esc(e.desc)} <small class="mut">· ${e.pm==='qris'?'QRIS':'Tunai'} · ${esc(e.by||'')}</small></span><span class="v">${rp(e.amt)}</span></div>`).join('');
$('#out').innerHTML=h;$('#st').textContent=''}catch(e){console.error(e);$('#out').innerHTML='<p class="err">Gagal memuat. Pastikan online, lalu pilih periode lagi.</p>';$('#st').textContent=''}}
function renderCup(){if(!$('#cup'))return;const ok=LAST.ok,q={},p=$('#pr').value;
ok.forEach(t=>(t.transaction_items||[]).forEach(i=>{const c=CM[i.menu_item_id]||'Lainnya';q[c]=(q[c]||0)+i.qty}));
const cats=Object.keys(q).sort(),saved=JSON.parse(localStorage.getItem('cupCats')||'null'),on=saved||cats.filter(c=>!/makan|food|snack|roti|cemil/i.test(c));
const inCup=i=>on.includes(CM[i.menu_item_id]||'Lainnya'),tot=cats.filter(c=>on.includes(c)).reduce((a,c)=>a+q[c],0),tg=+localStorage.getItem('cupTarget_'+p+'_'+$('#bq').value)||0;
{const kc=$('#kc');if(kc)kc.textContent=tot}
const pk={};ok.forEach(t=>(t.transaction_items||[]).forEach(i=>{if(inCup(i)){const n=NM[t.created_by]||'Lainnya/lama';pk[n]=(pk[n]||0)+i.qty}}));
$('#cup').innerHTML=`<div class="k"><div><small>Total cup</small><b>${tot}</b></div><div><small>Target periode ini</small><input id="tg" type="number" inputmode="numeric" value="${tg||''}" placeholder="isi target" style="padding:4px"></div></div>`
+(tg?`<div class="b" style="grid-template-columns:64px 1fr auto"><span class="l">Capaian</span><div class="t"><i style="width:${Math.min(100,tot/tg*100)}%"></i></div><span class="v">${tot}/${tg} · ${Math.round(tot/tg*100)}%${tot>=tg?' ✓ tercapai':''}</span></div>`:'')
+'<p class="mut" style="margin:10px 0 2px">Hitung sebagai cup (centang kategori minuman):</p>'
+cats.map(c=>`<label class="b" style="grid-template-columns:24px 1fr auto"><input type="checkbox" data-c="${esc(c)}" ${on.includes(c)?'checked':''} ${OWNR?'':'disabled'}><span>${esc(c)}</span><span class="v">${q[c]}</span></label>`).join('')
+(Object.keys(pk).length?'<p class="mut" style="margin:10px 0 2px">Cup per kasir:</p>'+bars(Object.entries(pk).sort((a,b)=>b[1]-a[1]).map(([n,v])=>[esc(n),v,v+' cup'])):'')}
document.addEventListener('change',e=>{const t=e.target;if(t.id==='tg'){localStorage.setItem('cupTarget_'+$('#pr').value+'_'+$('#bq').value,t.value);renderCup()}
if(t.dataset.c!==undefined){const cats=[...document.querySelectorAll('#cup [data-c]')],on=cats.filter(x=>x.checked).map(x=>x.dataset.c);localStorage.setItem('cupCats',JSON.stringify(on));api('settings?on_conflict=key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({key:'cupcats',value:JSON.stringify(on)})}).catch(()=>{});renderCup()}});
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};
const ld=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
const dt=iso=>{const x=new Date(iso);return[x.toLocaleDateString('sv'),x.toTimeString().slice(0,5)]};
async function allOf(t){let a=[],o=0;for(;;){const r=await api(`${t}?order=id&limit=1000&offset=${o}`);a=a.concat(r);if(r.length<1000)return a;o+=1000}}
$('#xl').onclick=async()=>{try{if(!window.XLSX)await ld('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
const bn=Object.fromEntries(BRS.map(b=>[b.id,b.name])),nm=Object.fromEntries((await api('profiles?select=id,name,full_name')).map(p=>[p.id,p.full_name||p.name])),{all,ex}=LAST;
const T=all.map(t=>{const[d,j]=dt(t.created_at);return{Cabang:bn[t.branch_id]||'','No Struk':t.receipt_no,Tanggal:d,Jam:j,Kasir:nm[t.created_by]||'',Subtotal:t.subtotal,Diskon:t.discount_total,Total:t.total,Metode:PM[t.payment_method]||t.payment_method,Status:t.voided_at?'BATAL':'OK','Alasan batal':t.void_reason||''}});
const I=all.flatMap(t=>{const[d]=dt(t.created_at);return(t.transaction_items||[]).map(i=>({Cabang:bn[t.branch_id]||'','No Struk':t.receipt_no,Tanggal:d,Item:i.item_name,Qty:i.qty,Harga:i.unit_price,Total:i.line_total,Status:t.voided_at?'BATAL':'OK'}))});
const E=ex.map(e=>{const[d,j]=dt(e.created_at);return{Cabang:bn[e.branch_id]||'',Tanggal:d,Jam:j,Kategori:EC[e.category]||e.category,Keterangan:e.description,Jumlah:e.amount,Dibayar:e.pay_method==='qris'?'QRIS':'Tunai','Dicatat oleh':nm[e.created_by]||''}});
const wb=XLSX.utils.book_new();[['Transaksi',T],['Item',I],['Belanja',E]].forEach(([n,r])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),n));
XLSX.writeFile(wb,`laporan-${$('#pr').value}-${new Date().toLocaleDateString('sv')}.xlsx`)}catch(e){console.error(e);alert('Gagal membuat Excel. Pastikan online.')}};
$('#bk').onclick=async()=>{try{const o={exported_at:new Date().toISOString()};for(const t of['branches','profiles','menu_items','discounts','transactions','transaction_items','transaction_discounts','expenses'])o[t]=await allOf(t);dl(new Blob([JSON.stringify(o)],{type:'application/json'}),`backup-kasir-${new Date().toLocaleDateString('sv')}.json`)}catch(e){console.error(e);alert('Backup gagal. Pastikan online.')}};
$('#pr').onchange=()=>{$('#rgb').classList.toggle('on',$('#pr').value==='range');load()};$('#d1').onchange=$('#d2').onchange=load;$('#d1').value=$('#d2').value=new Date().toLocaleDateString('sv');
if(!FULL)['bq','xl','bk'].forEach(i=>$('#'+i).hidden=true);if(prof&&prof.role!=='owner')$('#bk').hidden=true;if(prof&&prof.role==='manager')$('#bq').hidden=true;
if(FULL)api('settings?key=eq.cupcats').then(r=>{if(r&&r[0]){localStorage.setItem('cupCats',r[0].value);renderCup()}else if(OWNR&&localStorage.getItem('cupCats'))api('settings?on_conflict=key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({key:'cupcats',value:localStorage.getItem('cupCats')})})}).catch(()=>{});
$('#bq').onchange=()=>{localStorage.setItem('dbr',$('#bq').value);load()};
api('branches?order=name').then(b=>{BRS=prof.role==='manager'?b.filter(x=>x.id===prof.branch_id):b;$('#bq').innerHTML=(prof.role==='manager'?'':'<option value="all">Semua cabang</option>')+BRS.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('#bq').value=prof.role==='manager'?prof.branch_id:(localStorage.getItem('dbr')||'all');if(!$('#bq').value)$('#bq').value=prof.role==='manager'?prof.branch_id:'all';load()}).catch(()=>{$('#bq').innerHTML='<option value="all">Semua cabang</option>';load()});
</script></body></html>
